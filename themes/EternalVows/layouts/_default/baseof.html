<!doctype html>
<html lang="{{ site.Language.Lang | default "en" }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2d2616">
  <meta name="description" content="{{ site.Params.description | default site.Title }}">
  <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} | {{ site.Title }}{{ end }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=WindSong:wght@400;500&display=swap" rel="stylesheet">
  {{ $style := resources.Get "css/eternal-vows.css" | minify | fingerprint }}
  <link rel="stylesheet" href="{{ $style.RelPermalink }}" integrity="{{ $style.Data.Integrity }}">
</head>
<body>
  <img class="site-logo" src="{{ "images/logo.png" | relURL }}" alt="">
  {{ block "main" . }}{{ end }}
  <script>
    const collapsibleSections = document.querySelectorAll('.collapsible-section');
    const sectionLinks = document.querySelectorAll('a[href^="#"]');
    const mobileLayout = window.matchMedia('(max-width: 600px)');

    function setCollapsed(section, collapsed) {
      section.classList.toggle('section-collapsed', collapsed);
      const heading = section.querySelector('h2');
      if (heading) heading.setAttribute('aria-expanded', String(!collapsed));
    }

    function syncMobileSections() {
      collapsibleSections.forEach((section) => {
        setCollapsed(section, mobileLayout.matches);
      });
    }

    collapsibleSections.forEach((section) => {
      const heading = section.querySelector('h2');
      if (!heading) return;
      heading.setAttribute('role', 'button');
      heading.setAttribute('tabindex', '0');
      const toggle = () => {
        if (mobileLayout.matches) {
          setCollapsed(section, !section.classList.contains('section-collapsed'));
        }
      };
      heading.addEventListener('click', toggle);
      heading.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          toggle();
        }
      });
    });

    sectionLinks.forEach((link) => {
      link.addEventListener('click', () => {
        const section = document.querySelector(link.getAttribute('href'));
        if (section && mobileLayout.matches) setCollapsed(section, false);
      });
    });

    syncMobileSections();
    mobileLayout.addEventListener('change', syncMobileSections);
  </script>
</body>
</html>
