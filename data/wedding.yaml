faqs:
  - q: "Where are the ceremony and reception being held?"
    a: "Both the ceremony and reception will be held at Chicheley Hall, Chicheley Road, Newport Pagnell, MK16 9JJ."
  - q: "Is there parking at Chicheley Hall?"
    a: "Yes, there is plenty of free parking at the venue."
  - q: "Are electric vehicle charging facilities available?"
    a: "Yes. Multiple Roam Type 2 charging ports are available. Payment can be made through the Roam app or by contactless payment."
  - q: "Is accommodation available at Chicheley Hall?"
    a: "Yes. There are 33 individually furnished bedrooms overlooking the gardens. Rooms include a TV, en suite bathroom, tea and coffee making facilities, and breakfast the following morning."
  - q: "How can I book accommodation at Chicheley Hall?"
    a: "Please contact the sales team on 01234 230 396 or email enquiries@chicheleyhall.co.uk."
  - q: "Is there another nearby hotel?"
    a: "Yes. The Holiday Inn Milton Keynes East is on London Road, Newport Pagnell, MK16 0JA, less than three miles from the venue."
  - q: "How can I get to and from the venue?"
    a: "There are plenty of local taxi firms available if you require transport."
  - q: "What time can I arrive at the venue?"
    a: "Guests are welcome to arrive from 1:00 PM for drinks and canapés. The ceremony will begin at 2:00 PM."
  - q: "When can I check in to my room at Chicheley Hall?"
    a: "Check-in is from 3:00 PM, so there will be plenty of time after the wedding breakfast to get checked-in."
  - q: "When is check-out at Chicheley Hall?"
    a: "Check-out is by 11:00 AM."  
  - q: Can I bring my children to the wedding?
    a: "Due to guest number limitations, we can only accomodate children of our immediate family."